      - '.github/workflows/lint.yml'
  push:
    branches:
      - feat/enterprise-workspace-ux-20261117
      - fix/security-concurrent-case-creation-20261128
    paths:
      - 'eslint.config.mjs'
      - 'public/js/sidebar.js'
      - 'public/js/api.js'
      - 'public/js/workspace-modals.js'
      - 'server/tests/visual/recette-visuelle.js'
      - 'server/tests/local-date-format.test.js'
      - 'server/tests/workspace-navigation.test.js'
      - 'server/tests/sidebar-mobile-keyboard.test.js'
      - 'server/tests/accounting-expense-mappings.test.js'
      - 'server/tests/workspace-modal-accessibility.test.js'
      - '.github/workflows/lint.yml'
      - 'server/tests/security-alerts.test.js'

permissions:
  contents: read

jobs:
  eslint:
    name: ESLint — fichiers JavaScript ciblés
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Exécuter ESLint (version maintenue et figée)
        run: >-
          npx --yes --package=eslint@10.15.0 eslint
          eslint.config.mjs
          public/js/sidebar.js
          public/js/api.js
          public/js/workspace-modals.js
          public/js/admin.js
          public/js/visitor-analytics.js
          public/js/theme.js
          server/routes/admin.js
          server/routes/analytics.js
          server/utils/sunupilot-analytics.js
          server/tests/sunupilot-admin.test.js
          server/tests/visual/recette-visuelle.js
          server/tests/local-date-format.test.js
          server/tests/optional-fields.test.js
          server/tests/workspace-navigation.test.js
          server/tests/parametres-accessibility.test.js
          server/tests/dashboard-ui.test.js
          server/tests/sidebar-mobile-keyboard.test.js
          server/tests/accounting-expense-mappings.test.js
          server/tests/workspace-modal-accessibility.test.js
          server/app.js
          server/config/monitoring.js
          server/utils/log-sanitizer.js
          server/tests/log-sanitizer.test.js
          server/config/db.js
          server/email-outbox.js
          server/routes/professionnel.js
          server/tests/factures.test.js
          server/routes/clients.js
          server/tests/client-history-protection.test.js
          server/routes/public.js
          server/routes/assistant.js
          server/routes/dashboard.js
          server/routes/rapports.js
          server/tests/professional-tenant.test.js
          server/routes/auth.js
          server/routes/depenses.js
          server/routes/factures-recurrentes.js
          server/routes/factures.js
          server/routes/produits.js
          server/routes/public-api.js
          server/tests/auth-currency.test.js
          server/tests/currency-lock-concurrency.test.js
          server/tests/setup.js
          server/tests/company-group-ui.test.js
          server/tests/company-groups.test.js
          server/tests/invoice-quota-migration-v8.test.js
          server/tests/facture-pdf.test.js
          server/config/backup.js
          server/tests/restore-backup-roundtrip.test.js
          server/tests/auth.test.js
          server/utils/google-account.js
          server/tests/google-account-concurrency.test.js
          server/tests/register-concurrency.test.js
          server/tests/paiements.test.js
          server/tests/backup.test.js
          server/app.js
          server/utils/log-sanitizer.js
          server/tests/log-sanitizer.test.js
          server/tests/mobile-config.test.js
          mobile/scripts/check-capacitor-config.js
