name: Tests automatisés

on:
  pull_request:
    branches: ['fix/audit-ledger-hardening-lot1-20261127', main, 'feat/compliance-audit-ledger-lot1-20261126', feat/enterprise-multi-company-foundation-20261116, 'fix/invoice-pdf-continuation-identity-20261121', 'fix/accounting-invoice-cancellation-reversal-20261121', 'feat/accounting-expense-payment-mode-20261121', 'fix/audit-devise-relances-escape']
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests Node.js et MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: samafacture_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=30s
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=10s

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Valider Docker Compose et le chemin des variables
        run: |
          cp server/.env.example server/.env
          docker compose --env-file server/.env config --quiet
          cat > .env <<'ENV'
          APP_DOMAIN=example.invalid
          DB_NAME=samafacture
          DB_USER=samafacture_app
          DB_PASSWORD=ci-app-password-not-used
          DB_MIGRATION_USER=samafacture_migrator
          DB_MIGRATION_PASSWORD=ci-migration-password-not-used
          DB_BACKUP_USER=samafacture_backup
          DB_BACKUP_PASSWORD=ci-backup-password-not-used
          DB_ROOT_PASSWORD=ci-root-password-not-used
          JWT_SECRET=ci-secret-ne-pas-utiliser-en-production
          APP_URL=https://example.invalid
          ALLOWED_ORIGINS=https://example.invalid
          ENV
          docker compose --env-file .env -f docker-compose.yml -f docker-compose.production.yml config --format json > /tmp/samafacture-compose.json
          node <<'NODE'
          const fs = require('node:fs');
          const compose = JSON.parse(fs.readFileSync('/tmp/samafacture-compose.json', 'utf8'));
          const dependency = compose.services?.['pdf-worker']?.depends_on?.app;
          if (dependency?.condition !== 'service_healthy') {
            throw new Error('Le worker PDF doit attendre que le service app soit healthy.');
          }
          const dockerfile = fs.readFileSync('Dockerfile', 'utf8');
          if (!dockerfile.includes('HEALTHCHECK ')) {
            throw new Error('Le service app doit exposer un HEALTHCHECK utilisé par depends_on.');
          }
          console.log('Dépendance PDF validée : app healthy avant le worker PDF.');
          NODE
          docker run --rm -v "$PWD/deploy/nginx.scalable.conf.example:/etc/nginx/nginx.conf:ro" nginx:1.27-alpine nginx -t
          rm -f .env

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Construire l'image Docker et vérifier l'absence de secrets locaux
        shell: bash
        run: |
          # Simule les deux fichiers locaux les plus sensibles avant la construction.
          cp server/.env /tmp/server.env.ci
          cleanup() {
            if [ -f /tmp/server.env.ci ]; then mv /tmp/server.env.ci server/.env; fi
            rm -f .env
          }
          trap cleanup EXIT
          printf 'CI_SERVER_SECRET_SENTINEL=must-not-enter-image\n' > server/.env
          printf 'CI_ROOT_SECRET_SENTINEL=must-not-enter-image\n' > .env
          docker build --tag samafacture-pro:ci .

          # Inspecte le contenu réel de l'image, pas seulement les motifs du .dockerignore.
          docker run --rm --entrypoint /bin/sh samafacture-pro:ci -ec '
            test ! -e /app/server/.env
            test ! -e /app/.env
            test -f /app/server/.env.example
          '

      - name: Installer les dépendances
        working-directory: server
        run: npm ci

      - name: Vérifier les rôles SQL, les migrations isolées et le dump des triggers
        shell: bash
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: samafacture_roles_smoke
          DB_ROOT_PASSWORD: root
          DB_USER: ci_audit_runtime
          DB_PASSWORD: ci-audit-runtime-password
          DB_MIGRATION_USER: ci_audit_migrator
          DB_MIGRATION_PASSWORD: ci-audit-migration-password
          DB_BACKUP_USER: ci_audit_backup
          DB_BACKUP_PASSWORD: ci-audit-backup-password
        run: |
          set -euo pipefail
          mysql_container="$(docker ps -q --filter 'ancestor=mysql:8.0' | head -n 1)"
          if [ -z "$mysql_container" ]; then
            echo "Le conteneur MySQL de CI est introuvable." >&2
            exit 1
          fi

          # Le schéma est isolé du DB samafacture_test utilisé par les autres tests.
          docker exec -e MYSQL_PWD="$DB_ROOT_PASSWORD" "$mysql_container" \
            mysql --protocol=TCP --host=127.0.0.1 --user=root \
            -e "SET GLOBAL log_bin_trust_function_creators = ON; CREATE DATABASE IF NOT EXISTS \`$DB_NAME\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"

          docker cp deploy/provision-db-users.sh "$mysql_container":/tmp/provision-db-users.sh
          docker exec \
            -e DB_HOST=127.0.0.1 \
            -e DB_ROOT_PASSWORD="$DB_ROOT_PASSWORD" \
            -e DB_NAME="$DB_NAME" \
            -e DB_USER="$DB_USER" \
            -e DB_PASSWORD="$DB_PASSWORD" \
            -e DB_MIGRATION_USER="$DB_MIGRATION_USER" \
            -e DB_MIGRATION_PASSWORD="$DB_MIGRATION_PASSWORD" \
            -e DB_BACKUP_USER="$DB_BACKUP_USER" \
            -e DB_BACKUP_PASSWORD="$DB_BACKUP_PASSWORD" \
            -e NODE_ENV=production \
            "$mysql_container" /bin/bash /tmp/provision-db-users.sh

          # Le runner de migrations ne reçoit le compte DDL que pour ce processus éphémère.
          (
            cd server
            env NODE_ENV=production DB_HOST="$DB_HOST" DB_PORT=3306 \
              DB_NAME="$DB_NAME" DB_USER="$DB_USER" DB_PASSWORD="$DB_PASSWORD" \
              DB_MIGRATION_USER="$DB_MIGRATION_USER" DB_MIGRATION_PASSWORD="$DB_MIGRATION_PASSWORD" \
              node scripts/run-migrations.js
          )

          # Seul le compte backup, qui détient TRIGGER, peut lire et valider les définitions.
          (
            cd server
            env NODE_ENV=production DB_HOST="$DB_HOST" DB_PORT=3306 DB_NAME="$DB_NAME" \
              DB_BACKUP_USER="$DB_BACKUP_USER" DB_BACKUP_PASSWORD="$DB_BACKUP_PASSWORD" \
              node <<'NODE'
          const assert = require('node:assert/strict');
          const mysql = require('mysql2/promise');
          const { verifyAuditLedgerSchema } = require('./config/audit-ledger-schema');

          (async () => {
            const connection = await mysql.createConnection({
              host: process.env.DB_HOST,
              port: Number(process.env.DB_PORT),
              user: process.env.DB_BACKUP_USER,
              password: process.env.DB_BACKUP_PASSWORD,
              database: process.env.DB_NAME
            });
            try {
              const result = await verifyAuditLedgerSchema(connection);
              assert.equal(result.valid, true);
              console.log('Compte backup : protections append-only conformes.');
            } finally {
              await connection.end();
            }
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
          )

          # Le runtime valide le schéma avec son compte DML, puis doit échouer sur un CREATE permanent.
          docker exec -e MYSQL_PWD="$DB_MIGRATION_PASSWORD" "$mysql_container" \
            mysql --protocol=TCP --host=127.0.0.1 --user="$DB_MIGRATION_USER" "$DB_NAME" \
            -e "CREATE TABLE ci_runtime_probe (id INT PRIMARY KEY, label VARCHAR(40) NOT NULL)"

          (
            cd server
            env NODE_ENV=production DB_SKIP_MIGRATIONS=true DB_HOST="$DB_HOST" DB_PORT=3306 \
              DB_NAME="$DB_NAME" DB_USER="$DB_USER" DB_PASSWORD="$DB_PASSWORD" \
              DB_MIGRATION_USER="" DB_MIGRATION_PASSWORD="" DB_BACKUP_USER="" DB_BACKUP_PASSWORD="" \
              node <<'NODE'
          const assert = require('node:assert/strict');
          const { pool, initDatabase } = require('./config/db');
          (async () => {
            await initDatabase();
            await pool.query(
              'INSERT INTO ci_runtime_probe (id, label) VALUES (?, ?)',
              [1, 'runtime DML only']
            );
            const [[row]] = await pool.query('SELECT label FROM ci_runtime_probe WHERE id = 1');
            assert.equal(row.label, 'runtime DML only');
            await assert.rejects(
              pool.query('CREATE TABLE ci_runtime_must_not_create (id INT PRIMARY KEY)'),
              error => error && error.code === 'ER_TABLEACCESS_DENIED_ERROR'
            );
            const [visibleTriggers] = await pool.query(
              `SELECT TRIGGER_NAME FROM information_schema.TRIGGERS
                WHERE TRIGGER_SCHEMA = DATABASE()
                  AND TRIGGER_NAME IN ('trg_pro_audit_events_block_update', 'trg_pro_audit_events_block_delete')`
            );
            assert.equal(visibleTriggers.length, 0,
              'le compte runtime ne doit pas obtenir le privilège TRIGGER nécessaire à la lecture des définitions');
            console.log('Compte runtime : DML autorisé, DDL permanent et visibilité TRIGGER refusés.');
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          }).finally(async () => {
            await pool.end().catch(() => {});
          });
          NODE
          )

          # Le compte backup doit pouvoir exporter les triggers, sans privilèges globaux.
          docker exec -e MYSQL_PWD="$DB_BACKUP_PASSWORD" "$mysql_container" \
            mysqldump --protocol=TCP --host=127.0.0.1 --user="$DB_BACKUP_USER" \
            --no-tablespaces --single-transaction --triggers --events "$DB_NAME" \
            > /tmp/samafacture-audit-role-dump.sql
          grep -q 'trg_pro_audit_events_block_update' /tmp/samafacture-audit-role-dump.sql
          echo "Compte backup : mysqldump exporte bien les triggers du registre."

      - name: Détecter le navigateur Chromium du runner CI
        shell: bash
        run: |
          BROWSER_PATH=""
          for browser in google-chrome-stable google-chrome chromium chromium-browser; do
            if command -v "$browser" >/dev/null 2>&1; then
              BROWSER_PATH="$(command -v "$browser")"
              break
            fi
          done
          if [ -z "$BROWSER_PATH" ]; then
            echo "Aucun Chrome/Chromium préinstallé sur ce runner." >&2
            exit 1
          fi
          test -x "$BROWSER_PATH"
          "$BROWSER_PATH" --version
          echo "PUPPETEER_EXECUTABLE_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"

      - name: Diagnostiquer et bloquer les dépendances vulnérables
        working-directory: server
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const audit = require('./npm-audit.json');
          const vulnerabilities = audit.metadata?.vulnerabilities;
          if (!vulnerabilities) {
            throw new Error('npm audit n’a pas fourni de métadonnées valides ; contrôle de sécurité non vérifiable.');
          }
          const packages = Object.entries(audit.vulnerabilities || {}).map(([name, value]) => ({
            name,
            severity: value.severity,
            isDirect: value.isDirect,
            range: value.range,
            fixAvailable: value.fixAvailable,
            via: (value.via || []).map(item => typeof item === 'string'
              ? item
              : { name: item.name, title: item.title, url: item.url, range: item.range })
          }));
          console.log(JSON.stringify({ metadata: vulnerabilities, packages }, null, 2));
          const total = ['info', 'low', 'moderate', 'high', 'critical']
            .reduce((sum, level) => sum + Number(vulnerabilities[level] || 0), 0);
          if (total > 0) {
            console.error('CI bloquée : npm a signalé ' + total + ' vulnérabilité(s). Corrigez-les ou documentez une exception approuvée avant fusion.');
            process.exit(1);
          }
          console.log('Aucune vulnérabilité npm détectée.');
          NODE
      - name: Vérifier le script de recette staging
        working-directory: server
        run: node --check scripts/staging-smoke.js

      - name: Exécuter les tests
        timeout-minutes: 15
        working-directory: server
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: samafacture_test
          TEST_DB_NAME: samafacture_test
          JWT_SECRET: ci-secret-ne-pas-utiliser-en-production
          APP_URL: http://127.0.0.1:4000
        run: |
          mkdir -p tests/diagnostics
          node --process-timeout=12m --report-on-process-timeout --report-exclude-env --report-directory=tests/diagnostics --test --test-concurrency=1 --test-timeout=300000 --test-reporter=spec "tests/*.test.js"

      - name: Tester la restauration réelle d'une sauvegarde chiffrée
        timeout-minutes: 8
        run: |
          docker run --rm --network host \
            --env RUN_REAL_RESTORE_SMOKE=true \
            --env NODE_ENV=test \
            --env DB_HOST=127.0.0.1 \
            --env DB_PORT=3306 \
            --env DB_USER=root \
            --env DB_PASSWORD=root \
            --env DB_NAME=samafacture_test \
            --env JWT_SECRET=ci-secret-ne-pas-utiliser-en-production \
            --entrypoint /bin/sh \
            samafacture-pro:ci \
            -ec 'command -v mysqldump && command -v mysql && exec node --test tests/restore-backup-roundtrip.test.js'
      - name: Archiver les diagnostics des tests bloqués
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: samafacture-diagnostics-${{ github.run_number }}
          path: server/tests/diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Smoke test du démarrage cluster avec MySQL et Redis
        timeout-minutes: 11
        working-directory: server
        env:
          NODE_ENV: development
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: samafacture_cluster_smoke
          DB_POOL_SIZE: 5
          DB_QUEUE_LIMIT: 50
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: ci-secret-cluster-smoke-ne-pas-utiliser-en-production
          APP_URL: http://127.0.0.1:4178
          PORT: 4178
          WEB_CONCURRENCY: 2
          PDF_JOBS_DIR: /tmp/samafacture-cluster-smoke-pdf
          BACKUP_DIR: /tmp/samafacture-cluster-smoke-backups
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PDF_JOBS_DIR" "$BACKUP_DIR"
          node cluster.js > /tmp/samafacture-cluster-smoke.log 2>&1 &
          CLUSTER_PID=$!
          cleanup() {
            kill -TERM "$CLUSTER_PID" 2>/dev/null || true
            for attempt in $(seq 1 15); do
              if ! kill -0 "$CLUSTER_PID" 2>/dev/null; then break; fi
              sleep 1
            done
            kill -KILL "$CLUSTER_PID" 2>/dev/null || true
            wait "$CLUSTER_PID" 2>/dev/null || true
            cat /tmp/samafacture-cluster-smoke.log
          }
          trap cleanup EXIT

          READY=0
          for attempt in $(seq 1 90); do
            # La préparation initiale du schéma peut être longue ; aucune sonde HTTP ne doit
            # bloquer toute la boucle si le port vient d'ouvrir mais que le worker démarre.
            if curl --connect-timeout 2 --max-time 4 -fsS http://127.0.0.1:4178/api/ready > /tmp/samafacture-cluster-ready.json; then
              if grep -q '"redis":"up"' /tmp/samafacture-cluster-ready.json; then
                READY=1
                break
              fi
            fi
            if ! kill -0 "$CLUSTER_PID" 2>/dev/null; then
              echo "Le processus cluster s'est arrêté avant d'être prêt." >&2
              cat /tmp/samafacture-cluster-smoke.log
              exit 1
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "Le cluster n'a pas atteint l'état ready avec MySQL et Redis." >&2
            cat /tmp/samafacture-cluster-smoke.log
            cat /tmp/samafacture-cluster-ready.json 2>/dev/null || true
            exit 1
          fi

          # Cette route passe par le limiteur Redis partagé ; elle vérifie aussi
          # que les commandes RedisStore sont disponibles après le démarrage.
          curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:4178/api/config > /dev/null
          echo "Démarrage cluster validé : 2 workers, MySQL prêt et Redis opérationnel."

      - name: Recette visuelle responsive avec données extrêmes
        timeout-minutes: 20
        working-directory: server
        env:
          VISUAL_DATASET: worst
          VISUAL_ARTIFACTS_DIR: tests/visual/artifacts
        run: npm run test:visual

      - name: Publier les captures de la recette visuelle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: samafacture-recette-visuelle-${{ github.run_number }}
          path: server/tests/visual/artifacts/
          if-no-files-found: warn
          retention-days: 14
