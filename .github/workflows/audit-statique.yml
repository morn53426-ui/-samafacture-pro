name: Audit statique — code inutilisé

on:
  pull_request:
    branches: [main, 'feat/compliance-audit-ledger-lot1-20261126', 'feat/compliance-alerts-investigations-lot2-20261126', 'ci/enable-stacked-pr-checks-20261128', 'fix/security-alert-live-login-evidence-20261128', 'fix/security-case-closed-alert-guard-20261128', 'fix/security-active-case-alert-state-20261128']
    paths:
      - 'server/**'
      - 'mobile/**'
      - 'public/**'
      - 'scripts/**'
      - '.github/workflows/audit-statique.yml'
  workflow_dispatch:

  push:
    branches: ['fix/security-concurrent-case-creation-20261128', 'fix/security-test-tenant-isolation-20261128']
    paths:
      - 'server/**'
      - 'mobile/**'
      - 'public/**'
      - 'scripts/**'
      - '.github/workflows/audit-statique.yml'

permissions:
  contents: read

jobs:
  analyse-backend:
    name: Knip — backend Node.js
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Analyser les fichiers, exports et dépendances
        working-directory: server
        run: >-
          npx --yes knip@6.48.0
          --reporter json
          --output-file json=knip-audit.json
          --no-exit-code

      - name: Archiver le rapport backend
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-statique-backend
          path: server/knip-audit.json
          if-no-files-found: warn
          retention-days: 14

  references-frontend:
    name: Références statiques des scripts frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Vérifier les scripts référencés par les pages
        run: |
          node scripts/audit-public-script-references.js "$RUNNER_TEMP/audit-public-scripts.md"
          cat "$RUNNER_TEMP/audit-public-scripts.md"

      - name: Archiver le rapport frontend
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-statique-frontend
          path: ${{ runner.temp }}/audit-public-scripts.md
          if-no-files-found: warn
          retention-days: 14

  duplicate-code:
    name: Détection des blocs de code dupliqués
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Analyser les duplications JavaScript sans bloquer sur le seuil initial
        run: |
          npx --yes jscpd@5.4.3 \
            --min-tokens 80 \
            --min-lines 8 \
            --reporters console,json \
            --output "$RUNNER_TEMP/jscpd" \
            server/app.js server/cluster.js server/config server/middleware \
            server/routes server/services server/utils public/js

      - name: Archiver le rapport des duplications
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-duplicated-code
          path: ${{ runner.temp }}/jscpd/jscpd-report.json
          if-no-files-found: warn
          retention-days: 14
