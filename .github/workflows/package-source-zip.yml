name: Package complete source ZIP

on:
  pull_request:
    branches: [main, 'feat/compliance-audit-ledger-lot1-20261126', feat/enterprise-multi-company-foundation-20261116, 'fix/invoice-pdf-continuation-identity-20261121', 'fix/accounting-invoice-cancellation-reversal-20261121', 'feat/accounting-expense-payment-mode-20261121', 'fix/audit-devise-relances-escape', 'feat/compliance-alerts-investigations-lot2-20261126', 'ci/enable-stacked-pr-checks-20261128', 'fix/security-alert-live-login-evidence-20261128', 'fix/security-case-closed-alert-guard-20261128', 'fix/security-active-case-alert-state-20261128']
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  package-source:
    name: Build complete source archive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Create complete source ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip --prefix=SamaFacture-Pro/ HEAD -o dist/SamaFacture-Pro-Complet.zip
          test -s dist/SamaFacture-Pro-Complet.zip
          unzip -t dist/SamaFacture-Pro-Complet.zip
          sha256sum dist/SamaFacture-Pro-Complet.zip

      - name: Upload source ZIP
        uses: actions/upload-artifact@v7
        with:
          name: SamaFacture-Pro-Complet-PR-${{ github.event.pull_request.number }}
          path: dist/SamaFacture-Pro-Complet.zip
          if-no-files-found: error
          retention-days: 14
