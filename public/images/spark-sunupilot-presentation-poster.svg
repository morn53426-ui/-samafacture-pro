  <text x="192" y="256" text-anchor="middle" fill="#d8f5e2" font-size="20" font-weight="700">FACTURATION</text>
  <text x="192" y="292" text-anchor="middle" fill="#d8f5e2" font-size="18">CLIENTS · PRODUITS</text>
  <text x="192" y="326" text-anchor="middle" fill="#d8f5e2" font-size="18">DÉPENSES · RAPPORTS</text>
