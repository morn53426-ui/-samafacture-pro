<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Groupe de sociétés — SamaFacture Pro</title>
<script src="js/theme.js"></script>
<script src="js/icons.js"></script>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/enterprise-workspace.css" />
<link rel="icon" type="image/png" href="images/icon-192.png" />
<style>
.group-layout{display:grid;gap:20px;max-width:1180px}
.group-panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow-sm)}
.group-panel h2{margin:0 0 8px;font-size:1.08rem}
.group-muted{color:var(--ink-soft);font-size:.9rem}
.group-form{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.group-form .field{flex:1 1 240px;margin:0}
.group-form input{width:100%}
.group-company-list,.group-invite-list{display:grid;gap:12px;margin-top:16px}
.group-company,.group-invite{border:1px solid var(--line);border-radius:12px;padding:15px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.group-company-main{min-width:220px;flex:1}
.group-company-main strong{display:block;color:var(--ink)}
.group-company-main small{display:block;color:var(--ink-soft);margin-top:4px}
.group-actions{display:flex;gap:8px;flex-wrap:wrap}
.group-stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:16px}
.group-stat{background:var(--surface,rgba(15,27,51,.035));border:1px solid var(--line);border-radius:12px;padding:16px}
.group-stat strong{display:block;font-size:1.1rem;margin-top:7px}
.group-stat small{color:var(--ink-soft)}
.group-note{padding:12px 14px;border-radius:10px;background:var(--emerald-light);color:var(--ink);font-size:.88rem;line-height:1.5}
.group-empty{padding:24px;border:1px dashed var(--line);border-radius:12px;color:var(--ink-soft);text-align:center}
.group-danger{color:#a83232}
.group-status{margin-bottom:16px}
.group-dashboard-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:16px}
.group-currency-card{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--paper)}
.group-currency-card h3{margin:0 0 12px;font-size:1rem}
.group-metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.group-metric{min-width:0;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface,rgba(15,27,51,.035))}
.group-metric small{display:block;color:var(--ink-soft);font-size:.8rem}
.group-metric strong{display:block;margin-top:5px;font-size:1rem;overflow-wrap:anywhere}
.group-metric em{display:block;margin-top:4px;color:var(--ink-soft);font-size:.75rem;font-style:normal}
.group-alert-list{display:grid;gap:10px;margin-top:14px}
.group-alert{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:13px}
.group-alert strong{display:block}
.group-alert small{display:block;color:var(--ink-soft);margin-top:3px}
.group-performance{display:grid;gap:13px;margin-top:14px}
.group-performance-currency{border:1px solid var(--line);border-radius:12px;padding:14px}
.group-performance-currency h3{margin:0 0 10px;font-size:.95rem}
.group-performance-row{display:grid;grid-template-columns:72px minmax(80px,1fr) auto;gap:10px;align-items:center;margin:8px 0;font-size:.82rem}
.group-performance-track{height:9px;border-radius:99px;background:var(--line);overflow:hidden}
.group-performance-fill{height:100%;border-radius:99px;background:var(--primary,#176b4d)}
.group-company-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:8px;margin-top:12px}
.group-company-kpi{padding:10px;border-radius:9px;background:var(--surface,rgba(15,27,51,.035));font-size:.82rem}
.group-company-kpi small{display:block;color:var(--ink-soft);margin-bottom:4px}
.group-disclaimer{margin-top:14px;font-size:.82rem;line-height:1.5;color:var(--ink-soft)}
@media(max-width:640px){.group-performance-row{grid-template-columns:58px minmax(55px,1fr) auto}.group-alert{align-items:flex-start}}
@media(max-width:640px){.group-panel{padding:16px}.group-company{align-items:flex-start}}
</style>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-root"></div>
  <main class="main-content workspace-page" id="main-content" tabindex="-1">
    <header class="page-header workspace-page-header">
      <div>
        <div class="subscription-eyebrow">ESPACE ENTREPRISE · PILOTAGE MULTI-SOCIÉTÉS</div>
        <h1>Groupe & sociétés</h1>
        <p class="group-muted">Une vue claire de vos filiales, de leurs indicateurs et des actions à suivre.</p>
      </div>
      <button class="btn btn-outline" type="button" onclick="load()"><i class="ic" data-icon="refresh-cw"></i> Actualiser</button>
    </header>
    <div id="group-status" class="group-status" role="status" aria-live="polite"></div>
    <nav class="group-section-nav" id="group-section-nav" aria-label="Sections du centre de pilotage" hidden>
      <a href="#group-overview">Vue d’ensemble</a>
      <a href="#group-alerts">Alertes</a>
      <a href="#group-performance">Performance</a>
      <a href="#group-companies">Sociétés</a>
      <a href="#group-invitations">Invitations</a>
    </nav>
    <div id="group-content" class="group-layout" aria-busy="true"><div class="group-panel">Chargement du groupe…</div></div>
  </main>
</div>
<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script>
requireAuthPage();
renderSidebar('groupe-entreprise');

const root=document.getElementById('group-content');
const statusRoot=document.getElementById('group-status');
const currentUser=Api.currentUser()||{};

function setGroupNavigation(visible){
  const navigation=document.getElementById('group-section-nav');
  if(navigation)navigation.hidden=!visible;
}
function message(text,kind='info'){
  statusRoot.innerHTML='<div role="status" class="'+(kind==='error'?'error-box':'group-note')+'">'+escapeHtml(text)+'</div>';
}
function money(value,currency){
  return formatMontant(Number(value||0),currency||'FCFA');
}
function emailStatusLabel(item){
  const status=item.email_statut;
  if(status==='sent')return 'Email envoyé'+(item.email_envoye_le?' le '+formatDate(item.email_envoye_le):'');
  if(status==='processing')return 'Envoi email en cours';
  if(status==='retry')return 'Envoi temporairement bloqué — nouvelle tentative programmée';
  if(status==='failed')return 'Échec après plusieurs tentatives ('+Number(item.tentatives_email||0)+')';
  if(status==='cancelled')return 'Envoi annulé : invitation acceptée, révoquée ou expirée';
  if(status==='queued')return 'Email placé dans la file d’envoi';
  return 'État de l’email indisponible';
}
async function copyInvitationLink(invitationId,button){
  button.disabled=true;
  try{
    const result=await Api.get('/pro/company-group/invitations/'+invitationId+'/link');
    const link=String(result.invitation_url||'');
    if(!link)throw new Error('Le lien sécurisé n’est plus disponible.');
    if(navigator.clipboard?.writeText && window.isSecureContext){
      await navigator.clipboard.writeText(link);
    }else{
      const field=document.createElement('textarea');
      field.value=link;
      field.setAttribute('readonly','');
      field.style.position='fixed';
      field.style.left='-9999px';
      document.body.appendChild(field);
      field.select();
      const copied=document.execCommand('copy');
      field.remove();
      if(!copied)throw new Error('La copie automatique est indisponible sur ce navigateur.');
    }
    message('Lien sécurisé copié. Transmettez-le au propriétaire de la société invitée.');
  }catch(err){
    message(err.message||'Impossible de récupérer le lien sécurisé.','error');
  }finally{
    button.disabled=false;
  }
}

function renderCreate(){
  setGroupNavigation(false);
  root.innerHTML=`
    <section class="group-panel">
      <h2>Créer votre groupe</h2>
      <p class="group-muted">La société associée à votre compte sera la société principale. Vous pourrez ensuite inviter les propriétaires des autres sociétés.</p>
      <form id="create-group-form" class="group-form">
        <div class="field"><label for="group-name">Nom du groupe</label><input id="group-name" maxlength="190" required value="${escapeHtml(currentUser.entreprise_nom||'Groupe d’entreprises')}" /></div>
        <button class="btn btn-primary" type="submit">Créer le groupe</button>
      </form>
    </section>`;
  document.getElementById('create-group-form').addEventListener('submit',async event=>{
    event.preventDefault();
    const button=event.currentTarget.querySelector('button');
    button.disabled=true;
    try{
      await Api.post('/pro/company-group',{nom:document.getElementById('group-name').value.trim()});
      await load();
    }catch(err){message(err.message,'error');button.disabled=false;}
  });
}


function renderMembership(membership){
  setGroupNavigation(false);
  const group=membership.groupe||{};
  root.innerHTML=`
    <section class="group-panel">
      <h2>Votre société est rattachée à un groupe</h2>
      <p class="group-muted">Groupe : <strong>${escapeHtml(group.nom||'Groupe')}</strong></p>
      <div class="group-note">${group.actif
        ? 'Le propriétaire du groupe dispose d’un accès administrateur à l’espace de votre société. Vos données restent dans votre compte séparé.'
        : 'La formule Entreprise du propriétaire du groupe n’est plus active. L’accès au groupe est suspendu jusqu’à sa réactivation.'}</div>
      ${membership.peut_quitter?'<button class="btn btn-outline group-danger" id="leave-group" type="button" style="margin-top:16px">Quitter ce groupe</button>':''}
    </section>`;
  document.getElementById('leave-group')?.addEventListener('click',async()=>{
    if(!confirm('Quitter ce groupe ? Le propriétaire perdra son accès à votre société, mais toutes vos données resteront dans votre compte.'))return;
    try{
      const result=await Api.del('/pro/company-group/leave');
      localStorage.removeItem('sf_company_group_member');
      message(result.message||'Votre société a quitté le groupe.');
      await load();
    }catch(err){message(err.message,'error');}
  });
}

function renderGroup(data,dashboard){
  setGroupNavigation(true);
  const group=data.groupe;
  const companies=data.societes||[];
  const metricsByCompany=new Map((dashboard?.societes||[]).map(company=>[Number(company.id),company]));
  const invitations=data.invitations||[];
  const alertes=dashboard?.alertes||[];
  const invoiceCurrencies=dashboard?.factures_par_devise||[];
  const expenseCurrencies=dashboard?.depenses_par_devise||[];
  const stockCurrencies=dashboard?.stocks_par_devise||[];
  const cashCurrencies=dashboard?.caisses_par_devise||[];
  const currencies=[...new Set([
    ...invoiceCurrencies.map(row=>row.devise),
    ...expenseCurrencies.map(row=>row.devise),
    ...stockCurrencies.map(row=>row.devise),
    ...cashCurrencies.map(row=>row.devise)
  ].filter(Boolean))].sort();

  const currencyCards=currencies.map(currency=>{
    const invoice=invoiceCurrencies.find(row=>row.devise===currency)||{};
    const expense=expenseCurrencies.find(row=>row.devise===currency)||{};
    const stock=stockCurrencies.find(row=>row.devise===currency)||{};
    const cash=cashCurrencies.find(row=>row.devise===currency)||{};
    const invoiceCount=Number(invoice.nombre_factures||0);
    const unpaidCount=Number(invoice.nombre_impayees||0);
    const overdueCount=Number(invoice.nombre_en_retard||0);
    const stockAlerts=Number(stock.ruptures_stock||0)+Number(stock.stocks_faibles||0);
    return `
      <section class="group-currency-card" aria-label="Indicateurs en ${escapeHtml(currency)}">
        <h3>${escapeHtml(currency)}</h3>
        <div class="group-metric-section-label">Indicateurs principaux</div>
        <div class="group-metric-grid group-metric-grid-primary">
          <div class="group-metric"><small>Chiffre d’affaires facturé</small><strong>${money(invoice.total_facture,currency)}</strong><em>${invoiceCount} facture(s)</em></div>
          <div class="group-metric"><small>Montant encaissé</small><strong>${money(invoice.total_encaisse,currency)}</strong><em>Somme enregistrée sur les factures</em></div>
          <div class="group-metric"><small>Factures impayées</small><strong>${money(invoice.total_impaye,currency)}</strong><em>${unpaidCount} facture(s) avec solde restant</em></div>
          <div class="group-metric"><small>Factures en retard</small><strong>${money(invoice.total_en_retard,currency)}</strong><em>${overdueCount} facture(s) échue(s)</em></div>
        </div>
        <details class="group-secondary-details">
          <summary>Voir les indicateurs de dépenses, caisses et stocks</summary>
          <div class="group-metric-grid group-metric-grid-secondary">
            <div class="group-metric"><small>Dépenses enregistrées</small><strong>${money(expense.total_depenses,currency)}</strong><em>${Number(expense.nombre_depenses||0)} dépense(s)</em></div>
            <div class="group-metric"><small>Solde des caisses actives</small><strong>${money(cash.solde_total,currency)}</strong><em>${Number(cash.nombre_caisses||0)} caisse(s) suivie(s)</em></div>
            <div class="group-metric"><small>Valeur estimée du stock</small><strong>${money(stock.valeur_stock_estimee,currency)}</strong><em>${Number(stock.nombre_produits||0)} produit(s) au catalogue</em></div>
            <div class="group-metric"><small>Alertes de stock</small><strong>${stockAlerts}</strong><em>${Number(stock.ruptures_stock||0)} rupture(s) · ${Number(stock.stocks_faibles||0)} stock(s) faible(s)</em></div>
          </div>
        </details>
      </section>`;
  }).join('');

  const trendByCurrency=new Map();
  for(const row of dashboard?.performance_mensuelle||[]){
    const currency=row.devise||'INCONNUE';
    if(!trendByCurrency.has(currency))trendByCurrency.set(currency,new Map());
    const monthMap=trendByCurrency.get(currency);
    const item=monthMap.get(row.mois)||{mois:row.mois,total:0,nombre:0};
    item.total+=Number(row.total_facture||0);
    item.nombre+=Number(row.nombre_factures||0);
    monthMap.set(row.mois,item);
  }
  const trendHtml=[...trendByCurrency.entries()].map(([currency,months])=>{
    const values=[...months.values()].sort((a,b)=>a.mois.localeCompare(b.mois));
    const peak=Math.max(1,...values.map(item=>item.total));
    const bars=values.map(item=>{
      const width=Math.max(2,Math.round(item.total/peak*100));
      const date=new Date(item.mois+'-01T00:00:00Z');
      const label=Number.isNaN(date.getTime())?item.mois:date.toLocaleDateString('fr-FR',{month:'short',year:'2-digit',timeZone:'UTC'});
      return `<div class="group-performance-row"><span>${escapeHtml(label)}</span><div class="group-performance-track" role="img" aria-label="${escapeHtml(money(item.total,currency))} facturés"><div class="group-performance-fill" style="width:${width}%"></div></div><strong>${escapeHtml(money(item.total,currency))}</strong></div>`;
    }).join('');
    return `<div class="group-performance-currency"><h3>${escapeHtml(currency)}</h3>${bars}</div>`;
  }).join('');

  const alertHtml=alertes.map(item=>{
    const isInvoice=item.type==='factures_en_retard';
    const title=isInvoice?'Factures en retard':'Stock à surveiller';
    const detail=isInvoice
      ? Number(item.nombre||0)+' facture(s) · '+money(item.montant,item.devise)+' à recouvrer'
      : Number(item.ruptures||0)+' rupture(s) · '+Number(item.stocks_faibles||0)+' stock(s) faible(s)';
    const company=companies.find(row=>Number(row.id)===Number(item.societe_id));
    const openAction=company&&!company.is_primary
      ? '<button class="btn btn-outline" type="button" data-open="'+Number(company.id)+'">Ouvrir la filiale</button>'
      : '';
    return `<article class="group-alert"><div><strong>${escapeHtml(title)} — ${escapeHtml(item.societe||'Société')}</strong><small>${escapeHtml(detail)}</small></div>${openAction}</article>`;
  }).join('');

  const companyHtml=companies.map(company=>{
    const metrics=metricsByCompany.get(Number(company.id))||{};
    const invoiceSummary=(metrics.factures||[]).map(row=>`<div>${escapeHtml(row.devise||'INCONNUE')} : facturé ${escapeHtml(money(row.total,row.devise))} · encaissé ${escapeHtml(money(row.encaisse,row.devise))} · impayé ${escapeHtml(money(row.impaye,row.devise))}</div>`).join('')||'<div>Aucune facture</div>';
    const expenseSummary=(metrics.depenses||[]).map(row=>`<div>${escapeHtml(row.devise||'INCONNUE')} : ${escapeHtml(money(row.total,row.devise))}</div>`).join('')||'<div>Aucune dépense</div>';
    const cashSummary=(metrics.caisses||[]).map(row=>`<div>${escapeHtml(row.devise||'INCONNUE')} : ${escapeHtml(money(row.solde,row.devise))} (${Number(row.nombre||0)} caisse(s))</div>`).join('')||'<div>Aucune caisse active</div>';
    const stockSummary=(metrics.stock||[]).map(row=>`<div>${escapeHtml(row.devise||'INCONNUE')} : ${Number(row.ruptures||0)} rupture(s), ${Number(row.stocks_faibles||0)} faible(s) · valeur ${escapeHtml(money(row.valeur_estimee,row.devise))}</div>`).join('')||'<div>Aucun produit</div>';
    return `
      <article class="group-company">
        <div class="group-company-main">
          <strong>${escapeHtml(company.entreprise_nom||company.contact_nom||'Société')}</strong>
          <small>${company.is_primary?'Société principale':'Société rattachée'} · ${escapeHtml(company.pays_code||'')} · ${escapeHtml(company.devise||'')}</small>
          <small>${escapeHtml(company.email||'')} · NINEA/RCCM : ${escapeHtml(company.entreprise_ninea||company.entreprise_rccm||'Non renseigné')}</small>
          <div class="group-company-summary">
            <div class="group-company-kpi"><small>Facturation / encaissements / impayés</small>${invoiceSummary}</div>
            <div class="group-company-kpi"><small>Dépenses</small>${expenseSummary}</div>
            <div class="group-company-kpi"><small>Trésorerie des caisses</small>${cashSummary}</div>
            <div class="group-company-kpi"><small>Stock</small>${stockSummary}</div>
          </div>
        </div>
        <div class="group-actions">
          ${company.is_primary?'':'<button class="btn btn-outline" type="button" data-open="'+Number(company.id)+'">Ouvrir</button><button class="btn btn-outline group-danger" type="button" data-remove="'+Number(company.id)+'">Retirer</button>'}
        </div>
      </article>`;
  }).join('');

  root.innerHTML=`
    <section class="group-panel group-overview" id="group-overview" aria-labelledby="group-overview-title">
      <div class="group-overview-heading">
        <div>
          <div class="group-section-eyebrow">Vue d’ensemble</div>
          <h2 id="group-overview-title">${escapeHtml(group.nom)}</h2>
          <p class="group-muted">Centre de pilotage de ${companies.length} société(s). Les comptes et les données restent séparés ; seules les sociétés ayant accepté le rattachement sont visibles ici.</p>
        </div>
        <span class="group-status-chip"><i class="ic" data-icon="check-circle" aria-hidden="true"></i> Groupe actif</span>
      </div>
      <div class="group-overview-kpis" aria-label="Résumé du groupe">
        <article class="group-overview-kpi"><span>Sociétés rattachées</span><strong>${companies.length}</strong><small>Société principale incluse</small></article>
        <article class="group-overview-kpi"><span>Invitations en cours</span><strong>${invitations.length}</strong><small>Accès en attente de confirmation</small></article>
        <article class="group-overview-kpi"><span>Alertes à examiner</span><strong>${alertes.length}</strong><small>Factures ou stocks à surveiller</small></article>
        <article class="group-overview-kpi"><span>Devises suivies</span><strong>${currencies.length}</strong><small>Indicateurs gardés séparés par devise</small></article>
      </div>
      <div class="group-dashboard-grid">${currencyCards||'<div class="group-empty">Les indicateurs financiers apparaîtront dès que les sociétés auront enregistré des opérations.</div>'}</div>
      <p class="group-disclaimer">${escapeHtml(dashboard?.note||'Les montants sont présentés séparément par devise.')}</p>
    </section>
    <section class="group-panel" id="group-alerts" aria-labelledby="group-alerts-title">
      <div class="group-panel-heading"><div><h2 id="group-alerts-title">Alertes du groupe</h2><p class="group-muted">Les points qui nécessitent une vérification ou une action.</p></div><span class="group-section-count">${alertes.length}</span></div>
      <div class="group-alert-list">${alertHtml||'<div class="group-empty">Aucune alerte de facture échue ou de stock critique détectée.</div>'}</div>
    </section>
    <section class="group-panel" id="group-performance" aria-labelledby="group-performance-title">
      <div class="group-panel-heading"><div><h2 id="group-performance-title">Performance sur les six derniers mois</h2><p class="group-muted">Montant des factures émises par mois, regroupé par devise. Les factures annulées sont exclues.</p></div></div>
      <div class="group-performance">${trendHtml||'<div class="group-empty">Aucune facture émise sur la période disponible.</div>'}</div>
    </section>
    <section class="group-panel" id="group-companies" aria-labelledby="group-companies-title">
      <div class="group-panel-heading"><div><h2 id="group-companies-title">Sociétés du groupe</h2><p class="group-muted">${companies.length} société(s) rattachée(s), société principale incluse.</p></div></div>
      <div class="group-company-list">${companyHtml}</div>
    </section>
    <section class="group-panel" id="group-invitations" aria-labelledby="group-invitations-title">
      <div class="group-panel-heading"><div><h2 id="group-invitations-title">Inviter une société</h2><p class="group-muted">Le propriétaire de la société invitée doit accepter l’accès administrateur avant que ses données soient visibles par le groupe. L’invitation expire après 7 jours.</p></div></div>
      <form id="invite-company-form" class="group-form">
        <div class="field"><label for="company-email">Email du propriétaire de la société</label><input id="company-email" type="email" maxlength="190" required placeholder="direction@entreprise.com" /></div>
        <button class="btn btn-primary" type="submit">Envoyer l’invitation</button>
      </form>
      <div id="latest-invitation" style="margin-top:14px"></div>
      ${invitations.length?`<h3 style="margin:20px 0 0">Invitations en attente</h3><div class="group-invite-list">${invitations.map(item=>`
        <div class="group-invite"><div><strong>${escapeHtml(item.invited_email)}</strong><small class="group-muted">Expire le ${escapeHtml(formatDate(item.expire_at))}</small><small class="group-muted">${escapeHtml(emailStatusLabel(item))}</small></div><div class="group-actions"><button class="btn btn-outline" type="button" data-copy-invitation="${Number(item.id)}">Copier le lien</button>${item.email_statut==='failed'?'<button class="btn btn-outline" type="button" data-retry-email="'+Number(item.id)+'">Relancer l’email</button>':''}<button class="btn btn-outline group-danger" type="button" data-revoke="${Number(item.id)}">Révoquer</button></div></div>`).join('')}</div>`:''}
    </section>`;

  document.getElementById('invite-company-form').addEventListener('submit',async event=>{
    event.preventDefault();
    const button=event.currentTarget.querySelector('button');
    button.disabled=true;
    try{
      const result=await Api.post('/pro/company-group/invitations',{email:document.getElementById('company-email').value.trim()});
      const emailStatus=result.email_envoye
        ? '<span>Email envoyé et confirmé.</span>'
        : '<span>'+escapeHtml(result.avertissement||'Invitation créée. Son email sera traité par la file d’envoi sécurisée.')+'</span>';
      await load();
      const latestInvitation=document.getElementById('latest-invitation');
      if(latestInvitation){
        latestInvitation.innerHTML=
          '<div class="group-note" role="status" aria-live="polite">Invitation créée pour '+
          escapeHtml(result.email)+'. <a href="'+escapeHtml(result.invitation_url)+
          '" target="_blank" rel="noopener">Ouvrir le lien sécurisé</a>'+
          '<p class="group-invitation-mail-status">'+emailStatus+'</p></div>';
      }
    }catch(err){message(err.message,'error');}
    finally{button.disabled=false;}
  });
  root.querySelectorAll('[data-open]').forEach(button=>button.addEventListener('click',()=>{
    localStorage.setItem('sf_company_owner',String(button.dataset.open));
    location.href='dashboard.html';
  }));
  root.querySelectorAll('[data-remove]').forEach(button=>button.addEventListener('click',async()=>{
    const id=button.dataset.remove;
    if(!confirm('Retirer cette société du groupe ? Ses données resteront dans son compte indépendant.'))return;
    button.disabled=true;
    try{await Api.del('/pro/company-group/companies/'+id);await load();}
    catch(err){message(err.message,'error');button.disabled=false;}
  }));
  root.querySelectorAll('[data-copy-invitation]').forEach(button=>button.addEventListener('click',async()=>{
    await copyInvitationLink(button.dataset.copyInvitation,button);
  }));
  root.querySelectorAll('[data-retry-email]').forEach(button=>button.addEventListener('click',async()=>{
    const id=button.dataset.retryEmail;
    if(!confirm('Remettre cet email dans la file d’envoi ?'))return;
    button.disabled=true;
    try{
      const result=await Api.post('/pro/company-group/invitations/'+id+'/retry-email',{});
      message(result.message||'Email remis dans la file d’envoi sécurisée.');
      await load();
    }catch(err){
      message(err.message||'Impossible de relancer cet email.','error');
      button.disabled=false;
    }
  }));
  root.querySelectorAll('[data-revoke]').forEach(button=>button.addEventListener('click',async()=>{
    button.disabled=true;
    try{await Api.del('/pro/company-group/invitations/'+button.dataset.revoke);await load();}
    catch(err){message(err.message,'error');button.disabled=false;}
  }));
}
async function load(){
  setGroupNavigation(false);
  root.setAttribute('aria-busy','true');
  try{
    if(currentUser.plan==='entreprise'){
      const data=await Api.get('/pro/company-group');
      if(data.groupe){
        const dashboard=await Api.get('/pro/company-group/dashboard');
        renderGroup(data,dashboard);
        return;
      }
    }
    const membership=await Api.get('/pro/company-group/membership');
    if(membership.membre){
      localStorage.setItem('sf_company_group_member','true');
      renderMembership(membership);
      return;
    }
    localStorage.removeItem('sf_company_group_member');
    if(currentUser.plan==='entreprise'){renderCreate();return;}
    root.innerHTML='<section class="group-panel"><h2>Formule Entreprise requise</h2><p class="group-muted">La gestion des groupes et filiales est réservée à la formule Entreprise.</p><a class="btn btn-primary" href="abonnement.html">Voir les formules</a></section>';
  }catch(err){message(err.message,'error');}
  finally{root.setAttribute('aria-busy','false');}
}
load();
</script>
</body>
</html>
