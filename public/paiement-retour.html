<!doctype html>
<html lang="fr"><head><script src="js/theme.js"></script><script src="js/icons.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>État du paiement — SamaFacture Pro</title><link rel="stylesheet" href="css/style.css"><meta name="robots" content="noindex"></head>
<body><main class="auth-layout" style="max-width:640px;margin:8vh auto;padding:20px">
  <section class="card" style="padding:28px">
    <div class="pro-eyebrow">SAMAFACTURE PRO · CONFIRMATION</div>
    <h1>Vérification du règlement</h1>
    <p>Le retour du prestataire ne suffit pas à confirmer un paiement. Nous vérifions la confirmation officielle côté serveur.</p>
    <div id="payment-state" class="pro-list" aria-live="polite"><p>Vérification en cours…</p></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px">
      <button class="btn btn-primary" id="refresh-payment" type="button">Actualiser le statut</button>
      <a class="btn btn-outline" href="index.html">Retour à l’accueil</a>
    </div>
  </section>
</main>
<script>
const reference = new URLSearchParams(location.search).get('reference') || '';
const state = document.getElementById('payment-state');
async function refreshPayment() {
  if (!/^[a-f0-9]{64}$/.test(reference)) { state.textContent = 'Référence de paiement invalide.'; return; }
  state.textContent = 'Vérification auprès du serveur…';
  try {
    const response = await fetch('/api/payment-webhooks/' + encodeURIComponent(reference) + '/status', { cache: 'no-store', headers: { 'Accept': 'application/json' } });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || 'État indisponible.');
    const p = result.checkout;
    const paid = p.statut === 'payee';
    const pending = p.statut === 'en_attente' || p.statut === 'creation';
    state.innerHTML = '<div class="pro-list-row"><div><strong>' + (paid ? 'Paiement confirmé' : pending ? 'Paiement en cours de confirmation' : 'Paiement non confirmé') + '</strong><small>Facture ' + escapeHtml(p.facture_numero) + ' · ' + escapeHtml(p.entreprise_nom) + '</small></div><strong>' + formatMontant(p.montant,p.devise) + '</strong></div><p class="pro-note">' + (paid ? 'Le paiement a été confirmé par le prestataire et enregistré dans le système.' : pending ? 'Ne payez pas une deuxième fois. Actualisez à nouveau dans quelques instants ou contactez l’entreprise si le statut ne change pas.' : 'Aucun encaissement n’a été confirmé. Contactez l’entreprise pour une nouvelle demande de paiement.') + '</p>';
  } catch (err) {
    state.textContent = err.message;
  }
}
function escapeHtml(value) { return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function formatMontant(value,currency) { return new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Number(value)||0) + ' ' + (currency || 'XOF'); }
document.getElementById('refresh-payment').addEventListener('click',refreshPayment);
refreshPayment();
</script></body></html>
