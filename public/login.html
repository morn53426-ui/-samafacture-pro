<!DOCTYPE html>
<html lang="fr">
<head>
<script src="js/theme.js"></script>
<script src="js/icons.js"></script>
<script src="js/tooltip.js"></script>
<meta charset="UTF-8" />
<title>Connexion — SamaFacture Pro</title>
<meta name="description" content="Connectez-vous à SamaFacture Pro pour gérer vos factures, devis, clients et paiements." />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="canonical" href="https://votredomaine.com/login.html" />
<meta name="robots" content="index, follow" />
<link rel="stylesheet" href="css/style.css" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0F1B33" />
<link rel="icon" type="image/png" href="images/icon-192.png" />
<link rel="apple-touch-icon" href="images/icon-192.png" />
</head>
<body>
  <div class="auth-wrap">
    <div id="auth-side-root"></div>
    <div class="auth-form-side">
      <div class="auth-form-card">
        <div class="auth-form-badge">
          <div class="mark"><img src="images/icon-192.png" alt="" /></div>
          <span>SamaFacture Pro</span>
        </div>
        <h2>Content de vous revoir</h2>
        <p style="color:var(--ink-soft); margin-bottom:26px;">Connectez-vous pour gérer vos factures.</p>
        <div id="error-box"></div>

        <div id="google-btn" style="display:none; margin-bottom:18px;">
          <div class="gsi-slot"></div>
          <div class="auth-divider"><span>ou</span></div>
        </div>

        <form id="login-form">
          <div class="field">
            <label>Adresse email</label>
            <input type="email" id="email" required placeholder="vous@entreprise.com" />
          </div>
          <div class="field">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <label style="margin-bottom:0;">Mot de passe</label>
              <a href="mot-de-passe-oublie.html" style="font-size:0.8rem; color:var(--emerald); font-weight:600;">Mot de passe oublié ?</a>
            </div>
            <input type="password" id="password" required placeholder="••••••••" />
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%; padding:12px;">Se connecter</button>
        </form>
        <p style="margin-top:20px; font-size:0.88rem; color:var(--ink-soft);">
          Pas encore de compte ? <a href="register.html" style="color:var(--emerald); font-weight:600;">Créer un compte</a>
        </p>
      </div>
    </div>
  </div>

<script src="js/api.js"></script>
<script src="js/pwa.js"></script>
<script src="js/auth-slider.js"></script>
<script src="js/google-auth.js"></script>
<script>
  function redirectAfterLogin() {\n    const next = new URLSearchParams(location.search).get('next') || '';\n    if (next && /^[a-zA-Z0-9_./?=&%-]+$/.test(next) && !next.includes('..') && !next.startsWith('//')) location.href = next;\n    else location.href = 'dashboard.html';\n  }\n  if (Api.token()) redirectAfterLogin();
  initAuthSlider();
  initGoogleButton('google-btn');

  if (new URLSearchParams(location.search).get('reinitialise')) {
    document.getElementById('error-box').innerHTML =
      `<div style="background:var(--emerald-light); color:var(--emerald); padding:10px 14px; border-radius:8px; margin-bottom:14px; font-size:0.85rem;">Mot de passe réinitialisé avec succès. Vous pouvez vous connecter.</div>`;
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('error-box');
    errorBox.innerHTML = '';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const restore = setButtonLoading(e.target.querySelector('button[type=submit]'), 'Connexion…');
    try {
      const { token, user } = await Api.post('/auth/login', { email, password });
      Api.setSession(token, user);
      redirectAfterLogin();
    } catch (err) {
      errorBox.innerHTML = `<div class="error-box">${err.message}</div>`;
      restore();
    }
  });
</script>
</body>
</html>
