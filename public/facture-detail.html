<!DOCTYPE html>
<html lang="fr">
<head>
<script src="js/theme.js"></script>
<script src="js/icons.js"></script>
<script src="js/tooltip.js"></script>
<meta charset="UTF-8" />
<title>Facture — SunuPilot</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="css/style.css" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#18265B" />
<link rel="icon" type="image/png" href="images/icon-192.png" />
<link rel="apple-touch-icon" href="images/icon-192.png" />
<style>
  @page {
    size: A4 portrait;
    margin: 12mm 12mm 14mm;
  }
  body { background: #EDEAE2; }
  .wrap {
    width: min(210mm, calc(100% - 32px));
    max-width: 210mm;
    margin: 30px auto;
  }
  .toolbar { display:flex; justify-content:flex-end; gap:10px; margin-bottom:16px; }
  .invoice-doc, .invoice-doc * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .invoice-doc { min-height: 297mm; box-sizing: border-box; }
  @media (max-width: 640px) {
    .wrap { width: calc(100% - 16px); margin: 12px auto; }
    .invoice-doc { min-height: 0; }
    .toolbar { flex-wrap: wrap; }
  }
  @media print {
    html, body { width: auto !important; min-width: 0 !important; background: #fff !important; }
    body { margin: 0 !important; padding: 0 !important; }
    .toolbar { display: none !important; }
    .wrap { width: auto !important; max-width: none !important; margin: 0 !important; padding: 0 !important; }
    .invoice-doc {
      min-height: 0 !important;
      /* Les marges A4 sont déjà définies par @page ; ne pas ajouter un second
         retrait de 40 px qui rétrécit inutilement la zone imprimable. */
      padding: 0 !important;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="toolbar">
      <button class="btn btn-outline" onclick="window.close()">Fermer</button>
      <button class="btn btn-outline is-whatsapp" onclick="partagerDocumentWhatsApp(window.__sfCurrentInvoice)"><i class="ic" data-icon="message-circle"></i> WhatsApp</button>
      <button class="btn btn-outline" onclick="telechargerPdf(this)"><i class="ic" data-icon="download"></i> Télécharger le PDF</button>
      <button class="btn btn-primary" onclick="window.print()"><i class="ic" data-icon="printer"></i> Imprimer / Exporter en PDF</button>
    </div>
    <div class="invoice-doc" id="doc"></div>
  </div>

<script src="js/api.js"></script>
<script src="js/whatsapp-share.js"></script>
<script src="js/pwa.js"></script>
<script src="js/facture-templates.js"></script>
<script>
  requireAuthPage();
  const id = new URLSearchParams(location.search).get('id');
  let user, templates;

  // L'impression doit conserver la palette papier du modèle choisi, indépendamment du thème
  // de l'application. Le thème utilisateur est restauré lorsque l'aperçu d'impression se ferme.
  let themeAvantImpression = null;
  let impressionEnCours = false;

  function preparerThemeImpression() {
    if (impressionEnCours) return;
    impressionEnCours = true;
    themeAvantImpression = document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme', 'light');
  }

  function restaurerThemeApresImpression() {
    if (!impressionEnCours) return;
    if (themeAvantImpression === null) {
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', themeAvantImpression);
    }
    themeAvantImpression = null;
    impressionEnCours = false;
  }

  window.addEventListener('beforeprint', preparerThemeImpression);
  window.addEventListener('afterprint', restaurerThemeApresImpression);

  async function telechargerPdf(btn) {
    const restore = setButtonLoading(btn, 'Génération du PDF…');
    try {
      const res = await fetch(`${API_BASE}/factures/${id}/pdf`, {
        headers: { Authorization: `Bearer ${Api.token()}` }
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || `Erreur ${res.status} lors de la génération du PDF.`);
      }
      const blob = await res.blob();
      if (!blob.size) throw new Error('Le PDF généré est vide. Réessayez ou utilisez l’impression du navigateur.');
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = (res.headers.get('content-disposition') || '').match(/filename="(.+)"/)?.[1] || `document-${id}.pdf`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      // Certains navigateurs démarrent la lecture du téléchargement après le clic.
      // Une révocation immédiate peut produire un PDF vide ou interrompu.
      window.setTimeout(() => URL.revokeObjectURL(url), 60_000);
    } catch (err) {
      alert(err.message);
    } finally {
      restore();
    }
  }

  async function load() {
    // 🐛 Correctif : l'utilisateur était lu depuis Api.currentUser() (localStorage `sf_user`),
    // rempli uniquement lors d'un login/register normal dans un vrai navigateur. Or cette même
    // page est aussi ouverte par Puppeteer en headless pour générer le PDF (server/utils/pdf.js) :
    // ce flux-là n'injecte qu'un token temporaire (`sf_token`) dans localStorage, jamais `sf_user`.
    // Résultat avant ce correctif : `Api.currentUser()` valait `null` dans ce contexte, et
    // `user.devise`/`user.facture_template` levait une exception synchrone dès le chargement du
    // script — la page ne rendait jamais rien, `window.__docReady` n'était jamais posé, et
    // Puppeteer finissait par expirer après 15s (échec systématique de la génération PDF, quel
    // que soit le modèle choisi). On récupère maintenant l'utilisateur via GET /auth/me, qui ne
    // dépend que du token (présent dans les deux contextes) — et on obtient au passage des
    // données toujours à jour (logo/modèle/personnalisation tout juste enregistrés).
    const [{ user: freshUser }, { facture, lignes, qr_code }] = await Promise.all([
      Api.get('/auth/me'),
      Api.get(`/factures/${id}`)
    ]);
    user = freshUser;
    window.__sfCurrentInvoice = facture;
    templates = createFactureTemplates({
      escapeHtml, formatDate, statutBadge,
      formatMontant: (n) => formatMontant(n, user.devise)
    });

    const isDevis = facture.type === 'devis';
    const template = user.facture_template || 'classique';

    document.getElementById('doc').innerHTML = templates.renderInvoiceHtml({
      user, facture, lignes, isDevis, qrCode: qr_code, template,
      // Personnalisation (couleurs/logo/police) enregistrée par l'utilisateur — voir
      // public/parametres.html et server/routes/auth.js. Absente => rendu par défaut du modèle,
      // inchangé. C'est cette même page qui est capturée par Puppeteer pour générer le PDF
      // (server/utils/pdf.js), donc rien d'autre à modifier pour que la personnalisation
      // s'applique aussi au PDF téléchargé.
      personnalisation: user.facture_personnalisation || null
    });
    document.getElementById('doc').className = `invoice-doc tpl-${template}`;

    // Signal utilisé par la génération de PDF côté serveur (Puppeteer attend cette variable
    // avant de capturer la page — voir server/routes/factures.js, route /:id/pdf).
    window.__docReady = true;
  }

  load().catch(err => showFatalError(err.message));
</script>
</body>
</html>
