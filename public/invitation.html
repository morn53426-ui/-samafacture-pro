<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<meta name="referrer" content="no-referrer" />
<title>Invitation — OptiGest</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" type="image/svg+xml" href="images/optigest-icon.svg" />
<style>
body{min-height:100vh;background:var(--cream);display:grid;place-items:center;padding:24px}
.invite-card{width:min(100%,480px);background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-xl);padding:36px;position:relative;overflow:hidden}
.invite-card:before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--emerald),var(--gold))}
</style>
</head>
<body>
<main class="invite-card">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:24px"><img src="images/optigest-icon.svg" alt="" style="width:38px;height:38px;border-radius:10px"><strong style="font-family:var(--font-display)">OptiGest</strong></div>
  <div id="invite-content" aria-live="polite" aria-atomic="true"><h1>Invitation d’équipe</h1><p>Vérification du lien…</p></div>
</main>
<script src="js/api.js"></script>
<script>
(function(){
 const params=new URLSearchParams(location.search);
 const fragmentParams=new URLSearchParams(location.hash.replace(/^#/,'')); 
 const isCompanyGroup=params.get('type')==='company-group';
 const isTeam=params.get('type')==='team' || (!isCompanyGroup && params.has('token'));
 const resumeCompanyGroup=isCompanyGroup && params.get('resume')==='1';
 const resumeTeam=isTeam && params.get('resume')==='1';
 const root=document.getElementById('invite-content');
 const invitationStorageKey='sf_company_group_invitation_token';
 const verificationStorageKey='sf_company_group_verification_token';
 const teamInvitationStorageKey='sf_team_invitation_token';
 const teamVerificationStorageKey='sf_team_verification_token';
 const validToken=value=>/^[a-f0-9]{64}$/i.test(String(value||''));
 const groupResumeUrl='invitation.html?type=company-group&resume=1';
 const teamResumeUrl='invitation.html?type=team&resume=1';
 let token='';
 let verificationToken='';

 if(isCompanyGroup || isTeam){
   if(resumeTeam || resumeCompanyGroup){
     if(isTeam){
       token=sessionStorage.getItem(teamInvitationStorageKey)||'';
       verificationToken=sessionStorage.getItem(teamVerificationStorageKey)||'';
     }else{
       token=sessionStorage.getItem(invitationStorageKey)||'';
       verificationToken=sessionStorage.getItem(verificationStorageKey)||'';
     }
   }else{
     token=params.get('token')||fragmentParams.get('token')||'';
     verificationToken=params.get('verification_token')||fragmentParams.get('verification_token')||'';
     if(isTeam){
       if(validToken(token)) sessionStorage.setItem(teamInvitationStorageKey,token);
       else sessionStorage.removeItem(teamInvitationStorageKey);
       if(validToken(verificationToken)) sessionStorage.setItem(teamVerificationStorageKey,verificationToken);
       else sessionStorage.removeItem(teamVerificationStorageKey);
     }else{
       if(validToken(token)) sessionStorage.setItem(invitationStorageKey,token);
       else sessionStorage.removeItem(invitationStorageKey);
       if(validToken(verificationToken)) sessionStorage.setItem(verificationStorageKey,verificationToken);
       else sessionStorage.removeItem(verificationStorageKey);
     }
   }
 }else{
   token=params.get('token')||'';
   sessionStorage.removeItem(invitationStorageKey);
   sessionStorage.removeItem(verificationStorageKey);
   sessionStorage.removeItem(teamInvitationStorageKey);
   sessionStorage.removeItem(teamVerificationStorageKey);
 }

 if(!validToken(token)){
   root.innerHTML='<h1>Invitation invalide</h1><p>Le lien d’invitation est incomplet ou a expiré.</p>';
   return;
 }
 history.replaceState(null,'',isCompanyGroup?groupResumeUrl:(isTeam?teamResumeUrl:'invitation.html'));

 const next=isCompanyGroup
   ? groupResumeUrl
   : (isTeam?teamResumeUrl:'invitation.html?'+new URLSearchParams({token}).toString());

 function clearCompanyGroupTokens(){
   sessionStorage.removeItem(invitationStorageKey);
   sessionStorage.removeItem(verificationStorageKey);
 }
 function clearTeamTokens(){
   sessionStorage.removeItem(teamInvitationStorageKey);
   sessionStorage.removeItem(teamVerificationStorageKey);
 }
 function clearSecureInvitationTokens(){
   clearCompanyGroupTokens();
   clearTeamTokens();
 }

 async function postInvitationAsOwnAccount(endpoint,payload){
   const selectedCompany=localStorage.getItem('sf_company_owner');
   localStorage.removeItem('sf_company_owner');
   try{
     return await Api.post(endpoint,payload);
   }finally{
     if(selectedCompany!==null) localStorage.setItem('sf_company_owner',selectedCompany);
   }
 }

 function showSuccess(result){
   clearSecureInvitationTokens();
   if(!isCompanyGroup) localStorage.setItem('sf_company_owner',String(result.entreprise_id));
   else localStorage.setItem('sf_company_group_member','true');
   history.replaceState(null,'','invitation.html');
   root.innerHTML='<h1>Invitation acceptée</h1><p>'+escapeHtml(result.message)+'</p><a class="btn btn-primary" style="width:100%" href="'+(isCompanyGroup?'groupe-entreprise.html':'professionnel.html')+'">Continuer</a>';
 }

 if(!Api.token()){
   root.innerHTML='<h1>Vous avez été invité</h1><p>Connectez-vous avec l’adresse email qui a reçu l’invitation. Pour un groupe de sociétés, une confirmation sera envoyée à cette adresse avant tout rattachement. Les invitations classiques d’équipe nécessitent également une confirmation indépendante.</p><a class="btn btn-primary" style="width:100%" href="login.html?next='+encodeURIComponent(next)+'">Se connecter pour accepter</a><a style="display:block;text-align:center;margin-top:14px;color:var(--emerald)" href="register.html?next='+encodeURIComponent(next)+'">Créer un compte</a>';
   return;
 }

 if((isCompanyGroup || isTeam) && validToken(verificationToken)){
   root.innerHTML='<h1>Confirmation de votre adresse email</h1><p>Vérification du lien sécurisé et rattachement…</p><div id="invite-error" style="margin-top:14px"></div>';
   const endpoint=isCompanyGroup?'/pro/company-group/invitations/accept/verify':'/pro/team/invitations/accept/verify';
   postInvitationAsOwnAccount(endpoint,{token,verification_token:verificationToken})
     .then(showSuccess)
     .catch(err=>{
       document.getElementById('invite-error').innerHTML='<div class="error-box">'+escapeHtml(err.message)+'</div><p>Rechargez cette page pour réessayer ou demandez un nouveau lien si celui-ci a expiré.</p>';
     });
   return;
 }

 root.innerHTML=isCompanyGroup
   ? '<h1>Rejoindre un groupe de sociétés</h1><p>En acceptant, vous autorisez le propriétaire du groupe à accéder à l’espace de votre société avec les droits administrateur. Votre compte, vos factures et vos données restent séparés des autres sociétés du groupe. Vous devrez ensuite confirmer cette adresse depuis votre boîte email avant le rattachement.</p><button class="btn btn-primary" id="accept-invite" style="width:100%">Continuer vers la confirmation email</button><div id="invite-error" style="margin-top:14px"></div>'
   : (isTeam
     ? '<h1>Rejoindre une équipe</h1><p>En acceptant, l’entreprise qui vous a invité pourra accéder à son espace de travail selon les autorisations définies pour votre rôle. Une confirmation envoyée à cette adresse email sera nécessaire avant l’activation de votre accès.</p><button class="btn btn-primary" id="accept-invite" style="width:100%">Continuer vers la confirmation email</button><div id="invite-error" style="margin-top:14px"></div>'
     : '<h1>Rejoindre une équipe</h1><p>En acceptant, l’entreprise qui vous a invité pourra vous donner accès à son espace de travail selon les autorisations définies pour votre rôle.</p><button class="btn btn-primary" id="accept-invite" style="width:100%">Accepter l’invitation</button><div id="invite-error" style="margin-top:14px"></div>');

 document.getElementById('accept-invite').addEventListener('click',async()=>{
   const button=document.getElementById('accept-invite');
   button.disabled=true;
   button.textContent=(isCompanyGroup||isTeam)?'Envoi de la confirmation…':'Acceptation…';
   try{
     const result=isCompanyGroup
       ? await postInvitationAsOwnAccount('/pro/company-group/invitations/accept',{token})
       : await postInvitationAsOwnAccount('/pro/team/invitations/accept',{token});
     if((isCompanyGroup||isTeam) && result.verification_required){
       clearSecureInvitationTokens();
       root.innerHTML='<h1>Vérifiez votre boîte email</h1><p>'+escapeHtml(result.message)+'</p><p>Le rattachement ne sera effectué qu’après ouverture du lien de confirmation reçu à cette adresse. Ce lien expire après 20 minutes.</p>';
       return;
     }
     showSuccess(result);
   }catch(err){
     document.getElementById('invite-error').innerHTML='<div class="error-box">'+escapeHtml(err.message)+'</div>';
     button.disabled=false;
     button.textContent='Réessayer';
   }
 });
})();
</script>
</body>
</html>
