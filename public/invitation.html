<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<meta name="referrer" content="no-referrer" />
<title>Invitation — SamaFacture Pro</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" type="image/png" href="images/icon-192.png" />
<style>
body{min-height:100vh;background:var(--cream);display:grid;place-items:center;padding:24px}
.invite-card{width:min(100%,480px);background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-xl);padding:36px;position:relative;overflow:hidden}
.invite-card:before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--emerald),var(--gold))}
</style>
</head>
<body>
<main class="invite-card">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:24px"><img src="images/icon-192.png" alt="" style="width:38px;height:38px;border-radius:10px"><strong style="font-family:var(--font-display)">SamaFacture Pro</strong></div>
  <div id="invite-content"><h1>Invitation d’équipe</h1><p>Vérification du lien…</p></div>
</main>
<script src="js/api.js"></script>
<script>
(function(){
 const params=new URLSearchParams(location.search);
 const token=params.get('token')||'';
 const verificationToken=params.get('verification_token')||'';
 const isCompanyGroup=params.get('type')==='company-group';
 const root=document.getElementById('invite-content');

 if(!/^[a-f0-9]{64}$/i.test(token)){
   root.innerHTML='<h1>Invitation invalide</h1><p>Le lien d’invitation est incomplet.</p>';
   return;
 }

 const nextParams=new URLSearchParams();
 if(isCompanyGroup) nextParams.set('type','company-group');
 nextParams.set('token',token);
 if(isCompanyGroup && /^[a-f0-9]{64}$/i.test(verificationToken)){
   nextParams.set('verification_token',verificationToken);
 }
 const next='invitation.html?'+nextParams.toString();

 function showSuccess(result){
   if(!isCompanyGroup) localStorage.setItem('sf_company_owner',String(result.entreprise_id));
   else localStorage.setItem('sf_company_group_member','true');
   history.replaceState(null,'','invitation.html');
   root.innerHTML='<h1>Invitation acceptée</h1><p>'+escapeHtml(result.message)+'</p><a class="btn btn-primary" style="width:100%" href="'+(isCompanyGroup?'groupe-entreprise.html':'professionnel.html')+'">Continuer</a>';
 }

 if(!Api.token()){
   root.innerHTML='<h1>Vous avez été invité</h1><p>Connectez-vous avec l’adresse email qui a reçu l’invitation. Pour un groupe de sociétés, une seconde confirmation sera envoyée à cette adresse avant tout rattachement.</p><a class="btn btn-primary" style="width:100%" href="login.html?next='+encodeURIComponent(next)+'">Se connecter pour accepter</a><a style="display:block;text-align:center;margin-top:14px;color:var(--emerald)" href="register.html?next='+encodeURIComponent(next)+'">Créer un compte</a>';
   return;
 }

 if(isCompanyGroup && /^[a-f0-9]{64}$/i.test(verificationToken)){
   history.replaceState(null,'','invitation.html');
   root.innerHTML='<h1>Confirmation de votre adresse email</h1><p>Vérification du lien sécurisé et rattachement de votre société…</p><div id="invite-error" style="margin-top:14px"></div>';
   Api.post('/pro/company-group/invitations/accept/verify',{token,verification_token:verificationToken})
     .then(showSuccess)
     .catch(err=>{
       document.getElementById('invite-error').innerHTML='<div class="error-box">'+escapeHtml(err.message)+'</div><p>Retournez au lien d’invitation et demandez un nouveau message de confirmation si le lien a expiré.</p>';
     });
   return;
 }

 history.replaceState(null,'','invitation.html');
 root.innerHTML=isCompanyGroup
   ? '<h1>Rejoindre un groupe de sociétés</h1><p>En acceptant, vous autorisez le propriétaire du groupe à accéder à l’espace de votre société avec les droits administrateur. Votre compte, vos factures et vos données restent séparés des autres sociétés du groupe. Vous devrez ensuite confirmer cette adresse depuis votre boîte email avant le rattachement.</p><button class="btn btn-primary" id="accept-invite" style="width:100%">Continuer vers la confirmation email</button><div id="invite-error" style="margin-top:14px"></div>'
   : '<h1>Rejoindre une équipe</h1><p>En acceptant, l’entreprise qui vous a invité pourra vous donner accès à son espace de travail selon les autorisations définies pour votre rôle.</p><button class="btn btn-primary" id="accept-invite" style="width:100%">Accepter l’invitation</button><div id="invite-error" style="margin-top:14px"></div>';

 document.getElementById('accept-invite').addEventListener('click',async()=>{
   const button=document.getElementById('accept-invite');
   button.disabled=true;
   button.textContent=isCompanyGroup?'Envoi de la confirmation…':'Acceptation…';
   try{
     const result=isCompanyGroup
       ? await Api.post('/pro/company-group/invitations/accept',{token})
       : await Api.post('/pro/team/invitations/accept',{token});
     if(isCompanyGroup && result.verification_required){
       root.innerHTML='<h1>Vérifiez votre boîte email</h1><p>'+escapeHtml(result.message)+'</p><p>Le groupe ne pourra accéder à votre société qu’après ouverture du lien envoyé à cette adresse. Ce lien expire après 20 minutes.</p>';
       return;
     }
     showSuccess(result);
   }catch(err){
     document.getElementById('invite-error').innerHTML='<div class="error-box">'+escapeHtml(err.message)+'</div>';
     button.disabled=false;
     button.textContent='Réessayer';
   }
 });
})();;
</script>
</body>
</html>
