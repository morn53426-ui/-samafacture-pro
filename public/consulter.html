<!DOCTYPE html>
<html lang="fr">
<head>
<script src="js/theme.js"></script>
<script src="js/icons.js"></script>
<script src="js/tooltip.js"></script>
<meta charset="UTF-8" />
<title>Consulter le document — SunuPilot</title>
<meta name="description" content="Consultez votre facture ou devis en ligne." />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="css/style.css" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#18265B" />
<link rel="icon" type="image/svg+xml" href="images/sunupilot-icon.svg" />
<link rel="icon" type="image/svg+xml" href="images/sunupilot-icon.svg" />
<style>
  body { background: #EDEAE2; position: relative; overflow-x: hidden; }
  body::before {
    content: '';
    position: absolute; top: -180px; left: 50%; transform: translateX(-50%);
    width: 520px; height: 380px;
    background:
      radial-gradient(circle at 30% 30%, rgba(14,169,128,0.14), transparent 60%),
      radial-gradient(circle at 75% 20%, rgba(221,165,63,0.12), transparent 55%);
    filter: blur(10px);
    pointer-events: none;
  }
  .wrap { max-width: 800px; margin: 30px auto; padding: 0 16px; position: relative; }
  .toolbar {
    display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:16px;
    background: rgba(255,255,255,0.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.8);
    border-radius: var(--radius-sm);
    padding: 10px 16px;
  }
  .invoice-doc, .invoice-doc * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  /* Additif uniquement (nouvelle classe) : ne touche pas .invoice-doc, réutilisée telle
     quelle par les modèles internes de facture-detail.html — cette page publique a son
     propre habillage, sans modifier ce qui est partagé. */
  .invoice-doc--public {
    position: relative;
    overflow: hidden;
  }
  .invoice-doc--public::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--emerald), var(--gold));
  }
  @media print {
    body { background: #fff; }
    body::before { display: none; }
    .toolbar { display: none; }
    .wrap { margin: 0; max-width: none; }
    .invoice-doc { border: none; }
    .invoice-doc--public::before { display: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="toolbar">
      <div style="display:flex; align-items:center; gap:10px;">
        <img src="images/sunupilot-icon.svg" alt="SunuPilot" style="width:30px; height:30px; border-radius:8px; box-shadow:var(--shadow-sm);" />
        <span style="font-family:var(--font-display); font-weight:700; color:var(--navy-950);">SunuPilot</span>
      </div>
      <button class="btn btn-primary" onclick="window.print()"><i class="ic" data-icon="printer"></i> Imprimer / Enregistrer en PDF</button>
    </div>
    <div class="invoice-doc invoice-doc--public" id="doc">
      <div id="loading" style="text-align:center; padding:60px 20px; color:var(--ink-soft);">Chargement du document…</div>
    </div>
  </div>

<script src="js/api.js"></script>
<script src="js/facture-templates.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const code = params.get('code');

  async function load() {
    if (!id || !code) {
      document.getElementById('doc').innerHTML = `<div class="empty-state"><div class="ic">${Icon('x')}</div>Ce lien est incomplet ou invalide.</div>`;
      return;
    }
    try {
      const data = await Api.get(`/public/consulter/${encodeURIComponent(id)}/${encodeURIComponent(code)}`);
      const facture = data.facture;
      const user = {
        nom: facture.user_nom,
        entreprise_nom: facture.entreprise_nom,
        entreprise_adresse: facture.entreprise_adresse,
        entreprise_telephone: facture.entreprise_telephone,
        entreprise_email: facture.entreprise_email,
        entreprise_logo: facture.entreprise_logo,
        entreprise_ninea: facture.entreprise_ninea,
        entreprise_rccm: facture.entreprise_rccm,
        entreprise_site_web: facture.entreprise_site_web,
        entreprise_banque: facture.entreprise_banque,
        entreprise_rib: facture.entreprise_rib,
        entreprise_conditions_reglement: facture.entreprise_conditions_reglement,
        entreprise_mentions_legales: facture.entreprise_mentions_legales,
        signature_default: facture.signature_default
      };
      const templates = createFactureTemplates({
        escapeHtml,
        formatDate,
        statutBadge,
        formatMontant: (montant) => formatMontant(montant, facture.devise)
      });

      document.getElementById('doc').innerHTML = templates.renderInvoiceHtml({
        user,
        facture,
        lignes: data.lignes,
        isDevis: facture.type === 'devis',
        qrCode: null,
        template: facture.facture_template || 'classique',
        personnalisation: facture.facture_personnalisation
      });
    } catch (err) {
      document.getElementById('doc').innerHTML = `<div class="empty-state"><div class="ic">${Icon('x')}</div>${escapeHtml(err.message)}</div>`;
    }
  }
  load();
</script>
</body>
</html>
