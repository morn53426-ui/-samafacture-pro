<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Demande de paiement — SamaFacture Pro</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" type="image/png" href="images/icon-192.png" />
<style>
body{min-height:100vh;background:var(--cream);display:grid;place-items:center;padding:24px}
.payment-public{width:min(100%,560px);background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow-xl);padding:clamp(24px,5vw,44px);position:relative;overflow:hidden}
.payment-public:before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--emerald),var(--gold))}
.payment-brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;color:var(--navy-900)}
.payment-brand img{width:38px;height:38px;border-radius:10px}
.payment-amount{margin:24px 0;padding:22px;border-radius:18px;background:var(--emerald-light);text-align:center}
.payment-amount small{display:block;color:var(--ink-soft);font-weight:600}
.payment-amount strong{display:block;color:var(--emerald);font:800 clamp(2rem,8vw,3rem) var(--font-display);margin-top:6px}
.payment-info{display:grid;gap:12px;margin:20px 0}
.payment-info div{display:flex;justify-content:space-between;gap:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.payment-info span{color:var(--ink-soft)}
.payment-note{background:var(--gold-light);padding:14px;border-radius:12px;color:var(--ink);font-size:.88rem}
</style>
</head>
<body>
<main class="payment-public">
  <div class="payment-brand"><img src="images/icon-192.png" alt="" /> SamaFacture Pro</div>
  <div id="payment-content" style="padding-top:26px;text-align:center;color:var(--ink-soft)">Chargement de la demande…</div>
</main>
<script src="js/api.js"></script>
<script>
(async function(){
  const target=document.getElementById('payment-content');
  const token=new URLSearchParams(location.search).get('token')||'';
  if(!/^[a-f0-9]{64}$/i.test(token)){target.innerHTML='<h2>Lien invalide</h2><p>Cette demande de paiement est incomplète ou invalide.</p>';return;}
  try{
    const data=await Api.get('/public/paiement/'+token);
    const amount=Number(data.montant||0).toLocaleString('fr-FR',{maximumFractionDigits:2});
    const phone=String(data.telephone||'').replace(/[^0-9]/g,'');
    const wa=phone?'https://wa.me/'+phone+'?text='+encodeURIComponent('Bonjour, je vous contacte au sujet de la demande de paiement de la facture '+data.facture+'.'):'';
    target.innerHTML='<span class="badge" style="background:var(--emerald-light);color:var(--emerald)">DEMANDE DE PAIEMENT</span><h1 style="margin-top:16px">'+escapeHtml(data.entreprise||'Entreprise')+'</h1><p>Facture <strong>'+escapeHtml(data.facture)+'</strong></p><div class="payment-amount"><small>Montant demandé</small><strong>'+amount+' '+escapeHtml(data.devise)+'</strong></div><div class="payment-info"><div><span>Entreprise</span><strong>'+escapeHtml(data.entreprise||'—')+'</strong></div><div><span>Référence</span><strong>'+escapeHtml(data.facture)+'</strong></div><div><span>Solde de la facture</span><strong>'+Number(data.solde_facture||0).toLocaleString('fr-FR')+' '+escapeHtml(data.devise)+'</strong></div><div><span>Expire le</span><strong>'+escapeHtml(data.expiration?formatDate(data.expiration):'Sans expiration')+'</strong></div></div><div class="payment-note"><strong>Comment payer ?</strong><p style="margin:6px 0 0">Contactez l’entreprise pour obtenir les instructions de règlement par le moyen convenu. Ce lien et son QR code affichent une demande de paiement ; ils ne déclenchent pas un débit automatique.</p></div>'+(data.telephone?'<p style="margin-top:18px">Téléphone : <strong>'+escapeHtml(data.telephone)+'</strong></p>':'')+(data.email?'<p>Email : <strong>'+escapeHtml(data.email)+'</strong></p>':'')+(wa?'<a class="btn btn-primary" style="width:100%;margin-top:18px" href="'+wa+'" target="_blank" rel="noopener">Contacter l’entreprise sur WhatsApp</a>':'')+'<p class="pro-muted" style="margin-top:18px;font-size:.78rem">Conservez la référence de la facture et vérifiez toujours la confirmation du paiement auprès du bénéficiaire.</p>';
  }catch(err){target.innerHTML='<h2>Demande indisponible</h2><p>'+escapeHtml(err.message)+'</p>';}
})();
</script>
</body>
</html>
