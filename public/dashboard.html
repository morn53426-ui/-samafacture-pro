<!DOCTYPE html>
<html lang="fr">
<head>
<script src="js/theme.js"></script>
<script src="js/icons.js"></script>
<script src="js/tooltip.js"></script>
<meta charset="UTF-8" />
<title>Tableau de bord — SamaFacture Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="css/style.css" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0F1B33" />
<link rel="icon" type="image/png" href="images/icon-192.png" />
<link rel="apple-touch-icon" href="images/icon-192.png" />
<script src="js/chart-loader.js"></script>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-root"></div>
  <main class="main-content">
    <div id="topbar-root"></div>

    <div class="grid grid-4" id="stats-grid" style="margin-bottom:22px;">
      <div class="card stat-card card-skeleton"><div class="stat-top"><div class="stat-icon icon-emerald"><i class="ic" data-icon="banknote"></i></div></div><div class="stat-label">Chiffre d'affaires</div><div class="stat-value mono">···</div></div>
      <div class="card stat-card card-skeleton"><div class="stat-top"><div class="stat-icon icon-emerald"><i class="ic" data-icon="check-circle"></i></div></div><div class="stat-label">Factures payées</div><div class="stat-value mono">···</div></div>
      <div class="card stat-card card-skeleton"><div class="stat-top"><div class="stat-icon icon-gold"><i class="ic" data-icon="clock"></i></div></div><div class="stat-label">Factures en attente</div><div class="stat-value mono">···</div></div>
      <div class="card stat-card card-skeleton"><div class="stat-top"><div class="stat-icon icon-clay"><i class="ic" data-icon="alert-triangle"></i></div></div><div class="stat-label">Factures en retard</div><div class="stat-value mono">···</div></div>
    </div>

    <div class="grid grid-2">
      <div class="card">
        <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">
          <h3 id="chart-title" style="margin:0;">Évolution des ventes</h3>
          <div style="display:flex; gap:6px;">
            <button type="button" class="btn btn-sm btn-outline" data-periode="day" onclick="setPeriode('day')">Jour</button>
            <button type="button" class="btn btn-sm btn-outline" data-periode="week" onclick="setPeriode('week')">Semaine</button>
            <button type="button" class="btn btn-sm btn-outline" data-periode="month" onclick="setPeriode('month')">Mois</button>
          </div>
        </div>
        <div id="chart-wrap" style="margin-top:14px;">
          <canvas id="chart-evolution" height="130" role="img" aria-label="Graphique des ventes. Les valeurs détaillées sont disponibles dans les rapports."></canvas>
        </div>
      </div>
      <div class="card">
        <h3>Derniers clients</h3>
        <div id="derniers-clients">
          <div class="card-skeleton" style="display:flex; align-items:center; gap:12px; padding:10px 0;">
            <div class="avatar" style="width:34px;height:34px;"></div>
            <div style="flex:1;"><div style="font-weight:600;">Chargement</div><div style="font-size:0.78rem;">···</div></div>
          </div>
          <div class="card-skeleton" style="display:flex; align-items:center; gap:12px; padding:10px 0;">
            <div class="avatar" style="width:34px;height:34px;"></div>
            <div style="flex:1;"><div style="font-weight:600;">Chargement</div><div style="font-size:0.78rem;">···</div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:18px;">
      <h3>Derniers paiements</h3>
      <table>
        <thead><tr><th>Facture</th><th>Client</th><th>Méthode</th><th>Date</th><th>Montant</th></tr></thead>
        <tbody id="paiements-body">
          <tr class="row-skeleton"><td colspan="5"><div class="skeleton-bar" style="width:100%;"></div></td></tr>
          <tr class="row-skeleton"><td colspan="5"><div class="skeleton-bar" style="width:100%;"></div></td></tr>
          <tr class="row-skeleton"><td colspan="5"><div class="skeleton-bar" style="width:100%;"></div></td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/pwa.js"></script>
<script src="js/sidebar.js"></script>
<script>
  requireAuthPage();
  renderSidebar('dashboard');
  renderTopbar('Tableau de bord', "Vue d'ensemble de votre activité");

  let chart;
  let periode = 'day';

  async function load() {
    const stats = await Api.get('/dashboard');

    document.getElementById('stats-grid').innerHTML = `
      <div class="card stat-card">
        <div class="stat-top"><div class="stat-icon icon-emerald">${Icon('banknote')}</div></div>
        <div class="stat-label">Chiffre d'affaires</div>
        <div class="stat-value mono">${formatMontant(stats.chiffre_affaires)}</div>
      </div>
      <div class="card stat-card">
        <div class="stat-top"><div class="stat-icon icon-emerald">${Icon('check-circle')}</div></div>
        <div class="stat-label">Factures payées</div>
        <div class="stat-value mono">${stats.factures_payees.n}</div>
        <div class="stat-delta" style="color:var(--ink-soft);">${formatMontant(stats.factures_payees.total)}</div>
      </div>
      <div class="card stat-card">
        <div class="stat-top"><div class="stat-icon icon-gold">${Icon('clock')}</div></div>
        <div class="stat-label">Factures en attente</div>
        <div class="stat-value mono">${stats.factures_en_attente.n}</div>
        <div class="stat-delta" style="color:var(--ink-soft);">${formatMontant(stats.factures_en_attente.total)}</div>
      </div>
      <div class="card stat-card">
        <div class="stat-top"><div class="stat-icon icon-clay">${Icon('alert-triangle')}</div></div>
        <div class="stat-label">Factures en retard</div>
        <div class="stat-value mono">${stats.factures_en_retard.n}</div>
        <div class="stat-delta" style="color:var(--ink-soft);">${formatMontant(stats.factures_en_retard.total)}</div>
      </div>
    `;

    const clientsHtml = stats.derniers_clients.length
      ? stats.derniers_clients.map(c => `
        <div style="display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line);">
          <div class="avatar" style="width:34px;height:34px;font-size:0.78rem;">${initials(c.nom)}</div>
          <div style="flex:1;">
            <div style="font-weight:600;">${escapeHtml(c.nom)}</div>
            <div style="font-size:0.78rem; color:var(--ink-soft);">${escapeHtml(c.telephone || c.email)}</div>
          </div>
        </div>`).join('')
      : `<div class="empty-state"><div class="ic">${Icon('users')}</div>Aucun client pour l'instant</div>`;
    document.getElementById('derniers-clients').innerHTML = clientsHtml;

    const paiementsHtml = stats.derniers_paiements.length
      ? stats.derniers_paiements.map(p => `
        <tr>
          <td class="mono">${escapeHtml(p.numero)}</td>
          <td>${escapeHtml(p.client_nom)}</td>
          <td>${escapeHtml(p.methode)}</td>
          <td>${formatDate(p.date_paiement)}</td>
          <td class="mono">${formatMontant(p.montant)}</td>
        </tr>`).join('')
      : `<tr><td colspan="5"><div class="empty-state"><div class="ic">${Icon('wallet')}</div>Aucun paiement enregistré</div></td></tr>`;
    document.getElementById('paiements-body').innerHTML = paiementsHtml;

    await loadChart(periode);
  }

  async function loadChart(p) {
    periode = p;
    document.querySelectorAll('[data-periode]').forEach(b => b.classList.toggle('btn-primary', b.dataset.periode === p));
    document.querySelectorAll('[data-periode]').forEach(b => b.classList.toggle('btn-outline', b.dataset.periode !== p));

    const labels = { day: 'Évolution des ventes (par jour)', week: 'Évolution des ventes (par semaine)', month: 'Évolution des ventes (par mois)' };
    document.getElementById('chart-title').textContent = labels[p];

    const { rows } = await Api.get(`/rapports/ventes?group_by=${p}`);
    const chartLabels = rows.map(r => r.label);
    const data = rows.map(r => r.total);

    const canvas = document.getElementById('chart-evolution');
    try {
      await window.chartReady;
    } catch (err) {
      canvas.replaceWith(Object.assign(document.createElement('div'), {
        className: 'empty-state',
        innerHTML: `<div class="ic">${Icon('activity')}</div>Le graphique n'a pas pu se charger (pas d'accès internet).`
      }));
      return;
    }

    if (chart) chart.destroy();
    chart = new Chart(canvas, {
      type: 'bar',
      data: {
        labels: chartLabels.length ? chartLabels : ['—'],
        datasets: [{
          label: 'Ventes',
          data: data.length ? data : [0],
          backgroundColor: '#0FA980',
          borderRadius: 6,
          maxBarThickness: 40
        }]
      },
      options: {
        responsive: true,
        // Ce graphique est une donnée métier à lire, pas une décoration. Il ne s'anime
        // jamais lors du chargement, du changement de période ou du redimensionnement :
        // le résultat respecte ainsi prefers-reduced-motion et évite les mouvements inutiles.
        animation: false,
        transitions: {
          active: { animation: { duration: 0 } },
          resize: { animation: { duration: 0 } },
          show: { animations: { colors: { duration: 0 }, x: { duration: 0 }, y: { duration: 0 } } },
          hide: { animations: { colors: { duration: 0 }, x: { duration: 0 }, y: { duration: 0 } } }
        },
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true, grid: { color: '#EDEAE2' } }, x: { grid: { display: false } } }
      }
    });
  }

  function setPeriode(p) { loadChart(p).catch(err => showFatalError(err.message)); }

  load().catch(err => showFatalError(err.message));
</script>
</body>
</html>
